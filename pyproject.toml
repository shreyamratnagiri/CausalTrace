[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "causaltrace"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3",
 "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4",
 "opentelemetry-api>=1.27,<2", "opentelemetry-sdk>=1.27,<2",
 "opentelemetry-exporter-otlp-proto-http>=1.27,<2", "opentelemetry-proto>=1.27,<2",
 "httpx>=0.27,<1", "numpy>=1.26,<3", "scikit-learn>=1.5,<2", "networkx>=3.3,<4",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1", "mypy>=1.13,<2", "types-requests>=2.32", "pip-audit>=2.7,<3"]
[tool.setuptools.packages.find]
include = ["causaltrace*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
exclude = ["migrations", "demo/generate.py"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
