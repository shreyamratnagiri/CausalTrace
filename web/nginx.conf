server {
    listen 8080;
    server_name _;
    location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location /health { proxy_pass http://api:8000; }
    location /ready { proxy_pass http://api:8000; }
    location / { try_files $uri $uri/ /index.html; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'self'; frame-ancestors 'none'" always;
}
